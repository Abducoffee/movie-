name: Render Lake Peigneur Video

on:
  workflow_dispatch:   # Manual trigger only (recommended)

jobs:
  render:
    name: Render video
    runs-on: ubuntu-latest
    timeout-minutes: 500

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npm rebuild esbuild || true

      - name: Render video (silent)
        run: |
          mkdir -p out
          # GitHub Actions has no GPU → use software renderer (swangle)
          npx remotion render src/index.jsx Story out/full_silent.mp4 \
            --gl=swangle \
            --concurrency=1 \
            --image-format=jpeg \
            --jpeg-quality=85 \
            --crf=23

      - name: Add voiceover
        run: |
          npx remotion ffmpeg -y -hide_banner -loglevel error \
            -i out/full_silent.mp4 \
            -i voiceover.wav \
            -map 0:v -map 1:a \
            -c:v copy -c:a aac -b:a 192k \
            -shortest final.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: lake-peigneur-final
          path: final.mp4
          retention-days: 7
          
